<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Taj Enterprise</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    /* Login screen (same as before) */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
    .login-card {
      background: #1e293b;
      padding: 40px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #334155;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5);
    }
    .login-card h2 { color: #22c55e; margin-bottom: 10px; text-align: center; }
    .login-card .sub { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 0.9rem; }
    .login-card input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
    }
    .login-card button {
      width: 100%;
      background: #22c55e;
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
    }
    .error { color: #ef4444; margin-top: 15px; text-align: center; }

    /* Dashboard layout */
    .dashboard { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px;
      background: #1e293b;
      border-right: 1px solid #334155;
      padding: 20px 0;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-header { padding: 0 20px 20px; border-bottom: 1px solid #334155; margin-bottom: 20px; }
    .sidebar-header h3 { color: #22c55e; font-size: 1.3rem; }
    .sidebar-header p { font-size: 0.75rem; color: #94a3b8; }
    .nav-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-item i { width: 24px; }
    .nav-item:hover, .nav-item.active { background: #0f172a; color: #22c55e; border-left: 3px solid #22c55e; }
    .main-content { flex: 1; margin-left: 260px; padding: 20px 30px; }

    /* Stats cards */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 20px;
      padding: 20px;
      border: 1px solid #334155;
      transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-3px); }
    .stat-card .title { font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; }
    .stat-card .number { font-size: 2rem; font-weight: bold; color: #22c55e; }
    .stat-card .icon { float: right; font-size: 2rem; color: #334155; }

    /* Section title with button */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 25px 0 20px;
      border-bottom: 2px solid #22c55e;
      padding-bottom: 10px;
    }
    .section-title { font-size: 1.5rem; margin: 0; }
    .btn-add {
      background: #22c55e;
      color: #0f172a;
      border: none;
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Tables */
    .table-wrapper { overflow-x: auto; background: #1e293b; border-radius: 20px; border: 1px solid #334155; margin-bottom: 30px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #0f172a; color: #22c55e; font-weight: 600; }
    tr:hover { background: #0f172a; }

    /* Buttons */
    .btn-sm { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; border: none; cursor: pointer; margin: 2px; }
    .btn-edit { background: #f59e0b; color: #0f172a; }
    .btn-accept { background: #22c55e; color: #0f172a; }
    .btn-reject { background: #ef4444; }
    .btn-deliver { background: #3b82f6; }
    .btn-update { background: #3b82f6; padding: 4px 10px; border-radius: 16px; }
    .stock-input { width: 70px; padding: 5px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; text-align: center; }

    /* Status badges */
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
    .status-pending { background: #facc1510; color: #facc15; border: 1px solid #facc15; }
    .status-accepted { background: #22c55e10; color: #22c55e; border: 1px solid #22c55e; }
    .status-rejected { background: #ef444410; color: #ef4444; border: 1px solid #ef4444; }
    .status-delivered { background: #3b82f610; color: #3b82f6; border: 1px solid #3b82f6; }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-card {
      background: #1e293b;
      border-radius: 24px;
      width: 90%;
      max-width: 500px;
      padding: 25px;
      border: 1px solid #22c55e;
    }
    .modal-card h3 { color: #22c55e; margin-bottom: 20px; }
    .modal-card input, .modal-card select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: white;
    }
    .modal-card button { margin-top: 15px; width: 100%; }
    .close-modal { float: right; font-size: 24px; cursor: pointer; }

    @media (max-width: 768px) {
      .sidebar { width: 70px; }
      .sidebar-header h3, .sidebar-header p, .nav-item span { display: none; }
      .nav-item i { margin: 0 auto; }
      .main-content { margin-left: 70px; }
    }
  </style>
</head>
<body>

<!-- Login Section -->
<div id="loginContainer" class="login-container">
  <div class="login-card">
    <h2><i class="fas fa-store"></i> Taj Enterprise</h2>
    <div class="sub">Admin Login</div>
    <input type="text" id="username" placeholder="Username" autocomplete="off">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" style="display:none;">
  <div class="dashboard">
    <div class="sidebar">
      <div class="sidebar-header">
        <h3><i class="fas fa-store"></i> Taj Enterprise</h3>
        <p>Admin Panel</p>
      </div>
      <div class="nav-item active" data-tab="products"><i class="fas fa-boxes"></i> <span>Products</span></div>
      <div class="nav-item" data-tab="orders"><i class="fas fa-truck"></i> <span>Orders</span></div>
    </div>
    <div class="main-content">
      <!-- Stats -->
      <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="title">Total Products</div><div class="number" id="totalProducts">0</div><div class="icon"><i class="fas fa-box"></i></div></div>
        <div class="stat-card"><div class="title">Pending Orders</div><div class="number" id="pendingOrders">0</div><div class="icon"><i class="fas fa-clock"></i></div></div>
        <div class="stat-card"><div class="title">Accepted Orders</div><div class="number" id="acceptedOrders">0</div><div class="icon"><i class="fas fa-check-circle"></i></div></div>
        <div class="stat-card"><div class="title">Delivered</div><div class="number" id="deliveredOrders">0</div><div class="icon"><i class="fas fa-check-double"></i></div></div>
      </div>

      <!-- Products Section -->
      <div id="productsSection">
        <div class="section-header">
          <h2 class="section-title"><i class="fas fa-edit"></i> Products & Stock</h2>
          <button id="addProductBtn" class="btn-add"><i class="fas fa-plus"></i> Add Product</button>
        </div>
        <div class="table-wrapper">
          <div id="productsList">Loading...</div>
        </div>
      </div>

      <!-- Orders Section -->
      <div id="ordersSection" style="display:none;">
        <h2 class="section-title"><i class="fas fa-list"></i> Customer Orders</h2>
        <div class="table-wrapper">
          <div id="ordersList">Loading...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit Product Modal -->
<div id="editModal" class="modal">
  <div class="modal-card">
    <span class="close-modal" onclick="closeModal('editModal')">&times;</span>
    <h3>Edit Product</h3>
    <input type="hidden" id="edit_id">
    <input type="text" id="edit_name" placeholder="Product Name">
    <input type="number" id="edit_price" placeholder="Price (₹)" step="0.01">
    <select id="edit_category">
      <option value="milk">Milk</option><option value="dahi">Dahi</option>
      <option value="paneer">Paneer</option><option value="others">Others</option>
    </select>
    <input type="text" id="edit_image" placeholder="Image path (e.g., images/name.jpg)">
    <input type="number" id="edit_stock" placeholder="Stock Quantity" min="0">
    <button id="saveEditBtn" class="btn-accept">Save Changes</button>
    <div id="editError" class="error"></div>
  </div>
</div>

<!-- Add Product Modal -->
<div id="addModal" class="modal">
  <div class="modal-card">
    <span class="close-modal" onclick="closeModal('addModal')">&times;</span>
    <h3>Add New Product</h3>
    <input type="text" id="new_name" placeholder="Product Name *">
    <input type="number" id="new_price" placeholder="Price (₹) *" step="0.01">
    <select id="new_category">
      <option value="milk">Milk</option><option value="dahi">Dahi</option>
      <option value="paneer">Paneer</option><option value="others">Others</option>
    </select>
    <input type="text" id="new_image" placeholder="Image path (e.g., images/name.jpg)">
    <input type="number" id="new_stock" placeholder="Initial Stock" value="0" min="0">
    <button id="saveAddBtn" class="btn-accept">Add Product</button>
    <div id="addError" class="error"></div>
  </div>
</div>

<script>
  let currentTab = 'products';
  let productsData = [];
  let ordersData = [];

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorDiv = document.getElementById('loginError');
    if (!username || !password) { errorDiv.innerText = 'Enter credentials'; return; }
    errorDiv.innerText = 'Logging in...';
    try {
      const res = await fetch('/api/admin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadProducts();
        loadOrders();
        setInterval(loadOrders, 30000);
        document.querySelectorAll('.nav-item').forEach(item => {
          item.addEventListener('click', () => {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            currentTab = item.getAttribute('data-tab');
            document.getElementById('productsSection').style.display = currentTab === 'products' ? 'block' : 'none';
            document.getElementById('ordersSection').style.display = currentTab === 'orders' ? 'block' : 'none';
            if (currentTab === 'orders') renderOrdersTable();
          });
        });
        document.getElementById('addProductBtn').addEventListener('click', () => {
          document.getElementById('addModal').style.display = 'flex';
        });
      } else {
        errorDiv.innerText = 'Invalid credentials';
      }
    } catch (err) {
      errorDiv.innerText = 'Server error. Is backend running?';
    }
  });

  async function loadProducts() {
    try {
      const res = await fetch('/api/products');
      productsData = await res.json();
      renderProductsTable();
      updateStats();
    } catch (err) {
      document.getElementById('productsList').innerHTML = '<p style="color:red;">Failed to load products</p>';
    }
  }

  function renderProductsTable() {
    let html = `<table><thead><tr><th>ID</th><th>Product Name</th><th>Price (₹)</th><th>Category</th><th>Stock</th><th>Update Stock</th><th>Actions</th></tr></thead><tbody>`;
    productsData.forEach(p => {
      html += `<tr>
        <td>${p.id}</td>
        <td>${escapeHtml(p.name)}</td><td>₹${p.price}</td><td>${p.category}</td>
        <td><span id="stock_display_${p.id}">${p.stock}</span></td>
        <td><input type="number" id="stock_${p.id}" value="${p.stock}" class="stock-input" min="0">
            <button class="btn-update update-stock" data-id="${p.id}">Update</button></td>
        <td><button class="btn-sm btn-edit edit-product" data-id="${p.id}" data-name="${escapeHtml(p.name)}" data-price="${p.price}" data-category="${p.category}" data-image="${p.image || ''}" data-stock="${p.stock}"><i class="fas fa-edit"></i> Edit</button></td>
      </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('productsList').innerHTML = html;

    document.querySelectorAll('.update-stock').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = parseInt(btn.getAttribute('data-id'));
        const newStock = parseInt(document.getElementById(`stock_${id}`).value);
        if (isNaN(newStock) || newStock < 0) { alert('Invalid stock'); return; }
        const res = await fetch('/api/update-stock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId: id, newStock })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById(`stock_display_${id}`).innerText = newStock;
          alert('Stock updated');
          loadProducts();
        } else alert('Update failed');
      });
    });

    document.querySelectorAll('.edit-product').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('edit_id').value = btn.getAttribute('data-id');
        document.getElementById('edit_name').value = btn.getAttribute('data-name');
        document.getElementById('edit_price').value = btn.getAttribute('data-price');
        document.getElementById('edit_category').value = btn.getAttribute('data-category');
        document.getElementById('edit_image').value = btn.getAttribute('data-image');
        document.getElementById('edit_stock').value = btn.getAttribute('data-stock');
        document.getElementById('editModal').style.display = 'flex';
      });
    });
  }

  async function loadOrders() {
    try {
      const res = await fetch('/api/orders');
      ordersData = await res.json();
      updateStats();
      if (currentTab === 'orders') renderOrdersTable();
    } catch (err) { console.error(err); }
  }

  function renderOrdersTable() {
    if (!ordersData.length) { document.getElementById('ordersList').innerHTML = '<p>No orders yet</p>'; return; }
    let html = `<table><thead><tr><th>SL</th><th>Order No</th><th>Customer</th><th>Phone</th><th>Address</th><th>Items</th><th>Total</th><th>Slot</th><th>Status</th><th>Action</th></tr></thead><tbody>`;
    ordersData.forEach((o, idx) => {
      let itemsText = '';
      try { itemsText = JSON.parse(o.items).map(i => `${i.name} x${i.qty}`).join(', '); } catch(e) { itemsText = o.items; }
      let action = '';
      if (o.status === 'pending') {
        action = `<button class="btn-sm btn-accept accept-order" data-id="${o.id}">Accept</button> <button class="btn-sm btn-reject reject-order" data-id="${o.id}">Reject</button>`;
      } else if (o.status === 'accepted') {
        action = `<button class="btn-sm btn-deliver deliver-order" data-id="${o.id}">Deliver</button>`;
      } else {
        action = '—';
      }
      html += `<tr>
        <td>${idx+1}</td><td>${o.order_number || o.id}</td><td>${escapeHtml(o.customer_name)}</td>
        <td>${o.customer_phone}</td><td>${escapeHtml(o.address)}, ${escapeHtml(o.city)}</td>
        <td>${itemsText}</td><td>₹${o.total}</td><td>${o.delivery_slot}</td>
        <td><span class="status-badge status-${o.status}">${o.status}</span></td>
        <td>${action}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('ordersList').innerHTML = html;

    document.querySelectorAll('.accept-order').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = parseInt(btn.getAttribute('data-id'));
        if (confirm('Accept order?')) {
          const res = await fetch('/api/accept-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderId: id }) });
          const data = await res.json();
          if (data.success) { alert('Accepted'); loadOrders(); } else alert('Failed');
        }
      });
    });
    document.querySelectorAll('.reject-order').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = parseInt(btn.getAttribute('data-id'));
        if (confirm('Reject order?')) {
          const res = await fetch('/api/reject-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderId: id }) });
          const data = await res.json();
          if (data.success) { alert('Rejected'); loadOrders(); } else alert('Failed');
        }
      });
    });
    document.querySelectorAll('.deliver-order').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = parseInt(btn.getAttribute('data-id'));
        if (confirm('Mark as delivered?')) {
          const res = await fetch('/api/deliver-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderId: id }) });
          const data = await res.json();
          if (data.success) { alert('Delivered'); loadOrders(); } else alert('Failed');
        }
      });
    });
  }

  function updateStats() {
    document.getElementById('totalProducts').innerText = productsData.length;
    document.getElementById('pendingOrders').innerText = ordersData.filter(o => o.status === 'pending').length;
    document.getElementById('acceptedOrders').innerText = ordersData.filter(o => o.status === 'accepted').length;
    document.getElementById('deliveredOrders').innerText = ordersData.filter(o => o.status === 'delivered').length;
  }

  // Save product edit
  document.getElementById('saveEditBtn').addEventListener('click', async () => {
    const id = parseInt(document.getElementById('edit_id').value);
    const name = document.getElementById('edit_name').value.trim();
    const price = parseFloat(document.getElementById('edit_price').value);
    const category = document.getElementById('edit_category').value;
    const image = document.getElementById('edit_image').value.trim();
    const stock = parseInt(document.getElementById('edit_stock').value);
    if (!name || isNaN(price) || price <= 0 || isNaN(stock) || stock < 0) {
      document.getElementById('editError').innerText = 'Invalid data';
      return;
    }
    try {
      const res = await fetch('/api/update-product', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, name, price, category, image, stock })
      });
      const data = await res.json();
      if (data.success) {
        alert('Product updated');
        closeModal('editModal');
        loadProducts();
      } else {
        document.getElementById('editError').innerText = 'Update failed';
      }
    } catch (err) {
      document.getElementById('editError').innerText = 'Server error';
    }
  });

  // Add new product
  document.getElementById('saveAddBtn').addEventListener('click', async () => {
    const name = document.getElementById('new_name').value.trim();
    const price = parseFloat(document.getElementById('new_price').value);
    const category = document.getElementById('new_category').value;
    const image = document.getElementById('new_image').value.trim();
    const stock = parseInt(document.getElementById('new_stock').value);
    if (!name || isNaN(price) || price <= 0) {
      document.getElementById('addError').innerText = 'Name and valid price are required';
      return;
    }
    try {
      const res = await fetch('/api/add-product', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, category, image, stock: isNaN(stock) ? 0 : stock })
      });
      const data = await res.json();
      if (data.success) {
        alert('Product added successfully');
        closeModal('addModal');
        loadProducts();
        // Clear form
        document.getElementById('new_name').value = '';
        document.getElementById('new_price').value = '';
        document.getElementById('new_category').value = 'milk';
        document.getElementById('new_image').value = '';
        document.getElementById('new_stock').value = '0';
        document.getElementById('addError').innerText = '';
      } else {
        document.getElementById('addError').innerText = data.error || 'Failed to add product';
      }
    } catch (err) {
      document.getElementById('addError').innerText = 'Server error';
    }
  });

  window.closeModal = function(modalId) {
    document.getElementById(modalId).style.display = 'none';
  };

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
  }
</script>
</body>
</html>
